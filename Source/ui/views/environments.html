
<main>
  <div class="page-header">
    <div class="page-title">
      <h1 class="select-none">Environments</h1>
      <span class="badge badge-muted" id="envCount"></span>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="load()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="page-body" id="envList">
    <div class="muted" style="font-size:0.875rem">Loading…</div>
  </div>
</main>

<script>
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(v, suffix = '') {
  return v != null ? esc(String(v)) + suffix : '<span class="muted">—</span>';
}

function renderEnv(env, idx) {
  const objects = env.tracking_objects ?? [];
  const endpoints = env.api_endpoints ?? [];
  const connKeys = env.connection_string_keys ?? [];
  const s = env.settings ?? {};

  const overrides = [
    s.polling_interval_seconds != null ? `Polling: ${s.polling_interval_seconds}s` : null,
    s.export_to_file != null ? `File export: ${s.export_to_file ? 'on' : 'off'}` : null,
    s.export_to_api != null ? `API export: ${s.export_to_api ? 'on' : 'off'}` : null,
    s.retry_count != null ? `Retry: ${s.retry_count}×` : null,
  ].filter(Boolean);

  const objectRows = objects.length
    ? objects.map(o => `<tr>
        <td>${esc(o.name)}</td>
        <td class="col-mono">${esc(o.table_name)}</td>
        <td>${o.database ? `<span class="pill">${esc(o.database)}</span>` : '<span class="muted">—</span>'}</td>
        <td class="col-mono" style="font-size:0.7rem">${esc(o.stored_procedure_name ?? '—')}</td>
        <td><span class="badge ${o.initial_sync_mode === 'Full' ? 'badge-info' : 'badge-muted'}">${esc(o.initial_sync_mode ?? 'Incremental')}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="empty-state">No tracking objects</td></tr>';

  const endpointRows = endpoints.length
    ? endpoints.map(e => {
        const type = e.mq_type ? e.mq_type : 'HTTP';
        const target = e.mq_type ? '' : esc(e.url ?? '');
        const auth = e.auth_type ? `<span class="badge badge-muted">${esc(e.auth_type)}</span>` : '';
        return `<tr>
          <td>${e.key ? `<span class="badge badge-muted">${esc(e.key)}</span>` : '<span class="muted">—</span>'}</td>
          <td><span class="badge badge-info">${esc(type)}</span></td>
          <td class="col-mono truncate" style="max-width:200px" title="${esc(e.url ?? '')}">${target}</td>
          <td>${auth}</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="4" class="empty-state">No endpoints</td></tr>';

  return `<div class="accordion" id="acc-${idx}">
    <button class="accordion-trigger" onclick="toggleAccordion(${idx})">
      <span class="accordion-trigger-left">
        <span class="badge badge-muted">${esc(env.name)}</span>
        <span style="font-size:0.8rem;font-weight:400;color:hsl(var(--muted-foreground))">${objects.length} objects · ${endpoints.length} endpoints</span>
      </span>
      <svg class="accordion-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="accordion-body">

      <div class="accordion-section">
        <div class="accordion-section-title">Connection Strings</div>
        <div class="pill-list">
          ${connKeys.length ? connKeys.map(k => `<span class="pill">${esc(k)}</span>`).join('') : '<span class="muted" style="font-size:0.8rem">None</span>'}
        </div>
      </div>

      ${overrides.length ? `<div class="accordion-section">
        <div class="accordion-section-title">Overrides</div>
        <div class="pill-list">${overrides.map(o => `<span class="pill">${esc(o)}</span>`).join('')}</div>
      </div>` : ''}

      <div class="accordion-section">
        <div class="accordion-section-title">Tracking Objects (${objects.length})</div>
        <div class="table-wrapper" style="border:none;border-radius:0">
          <div class="scroll-area" style="max-height:260px">
            <table>
              <thead><tr><th>Name</th><th>Table</th><th>Database</th><th>Stored Procedure</th><th>Sync Mode</th></tr></thead>
              <tbody>${objectRows}</tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="accordion-section">
        <div class="accordion-section-title">API Endpoints (${endpoints.length})</div>
        <div class="table-wrapper" style="border:none;border-radius:0">
          <div class="scroll-area" style="max-height:220px">
            <table>
              <thead><tr><th>Key</th><th>Type</th><th>URL / Target</th><th>Auth</th></tr></thead>
              <tbody>${endpointRows}</tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>`;
}

function toggleAccordion(idx) {
  const el = document.getElementById(`acc-${idx}`);
  el.classList.toggle('open');
}

async function load() {
  const list = document.getElementById('envList');
  try {
    const envs = await fetch('/ui/api/environments').then(r => r.json());
    const arr = Array.isArray(envs) ? envs : [];
    document.getElementById('envCount').textContent = `${arr.length} environment${arr.length !== 1 ? 's' : ''}`;
    list.innerHTML = arr.length
      ? arr.map((env, i) => renderEnv(env, i)).join('')
      : '<div class="muted" style="font-size:0.875rem">No environments configured</div>';
  } catch(e) {
    list.innerHTML = `<div class="muted" style="font-size:0.875rem">Failed to load environments: ${esc(e.message)}</div>`;
  }
}

load();
</script>
