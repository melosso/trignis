name: Tests

on:
  push:
    branches: [main, "release/**"]
    paths: ["Source/**", "Tests/**", "trignis.sln", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["Source/**", "Tests/**", "trignis.sln", ".github/workflows/tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        run: dotnet build trignis.sln --configuration Release

      - name: Test
        run: dotnet test trignis.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "TestResults/*.trx"
